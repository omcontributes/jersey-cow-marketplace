spring.application.name=cowmarketplace

# --- Database ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/cow_marketplace_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:your_postgres_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# --- File storage ---
app.file.upload-dir=${FILE_STORAGE_PATH:./uploads/cow-images}

# --- JWT ---
app.jwt.secret=${JWT_SECRET:8f42a73054b1749f8f58848be5e6502c8a4fb2e8b6b6a63e1c1b9f2a8d4c6e0f1a3b5c7d9e1f3a5b7c9d1e3f5a7b9c}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# --- Multipart / file upload limits ---
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=25MB

# --- Server ---
server.port=8080